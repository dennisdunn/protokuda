name: Release

# Runs when a semver tag is pushed (npm version ... && git push --follow-tags):
# publishes to npm and deploys the demo site to GitHub Pages.
# Running it by hand from the Actions tab redeploys the site only.
#
# Keep this file named publish.yml: npm's trusted publisher setting refers to it.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Check tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Skip if this version is already on npm
        id: published
        run: |
          if npm view "protokuda@$VERSION" version >/dev/null 2>&1; then
            echo "protokuda@$VERSION is already published; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      # TEMPORARY: prints the identity this run presents to npm, to compare with the
      # trusted publisher settings on npmjs.com. Only the decoded claims are shown,
      # never the token. Remove once publishing from CI works.
      - name: Show OIDC claims sent to npm
        if: steps.published.outputs.exists != 'true'
        run: |
          node --input-type=module <<'EOF'
          const url = `${process.env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org`;
          const res = await fetch(url, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          });
          const { value } = await res.json();
          const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString());
          const fields = ['repository_owner', 'repository', 'workflow_ref', 'job_workflow_ref',
                          'ref', 'event_name', 'environment', 'aud'];
          for (const f of fields) console.log(`${f.padEnd(18)} ${claims[f] ?? '(none)'}`);
          EOF

      # prepack runs the build.
      - if: steps.published.outputs.exists != 'true'
        run: npm publish

  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write   # required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci

      - run: npm run build:site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
