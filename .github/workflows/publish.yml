name: Publish to npm

# Runs when a semver tag is pushed (npm version ... && git push --follow-tags).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  id-token: write   # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - name: Check tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Skip if this version is already on npm
        id: published
        run: |
          if npm view "protokuda@$VERSION" version >/dev/null 2>&1; then
            echo "protokuda@$VERSION is already published; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      # prepack runs the build.
      - if: steps.published.outputs.exists != 'true'
        run: npm publish
